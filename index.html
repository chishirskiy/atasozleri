<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Книга мудрости моего папы</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=9">
</head>

<body>

<!-- ОБЛОЖКА -->

<section id="hero" class="hero-screen">

    <div class="hero-content">

        <div class="butterfly">🦋</div>

        <h1 class="hero-title">
            Книга мудрости<br>моего папы
        </h1>

        <p class="hero-subtitle">
            Этот сайт создан с любовью.
            <br>
            Здесь собраны слова,
            которые помогали мне становиться сильнее.
        </p>

        <button id="openBook" class="btn btn-primary btn-lg">
            📖 Открыть книгу
        </button>

    </div>

</section>

<!-- КНИГА -->

<section id="book" style="display:none;">

<div class="container py-5">
    
    <div id="stats" class="stats-grid mb-4"></div>

    <div class="reading-progress mb-4">

        <div class="reading-progress-top">

            <span>
                📖 Прочитано
            </span>

            <span id="readingProgressText">
                0 из 0
            </span>

        </div>

        <div class="reading-progress-bar">
            <div id="readingProgressFill"></div>
        </div>

</div>

     <div class="latest-section mb-5">

        <h3 class="latest-title">
            🆕 Последние добавленные
        </h3>

        <div id="latestQuotes" class="latest-grid"></div>

</div>

    <input
        id="search"
        class="form-control form-control-lg mb-4"
        placeholder="🔍 Найти мудрость...">

<div class="d-flex justify-content-center gap-3 mb-4">

    <button id="dailyQuote" class="btn btn-success btn-lg">
        🌅 Мудрость дня
    </button>

    <button id="randomQuote" class="btn btn-warning btn-lg">
        🎲 Случайная мудрость
    </button>

    <button id="favoriteFilter" class="btn btn-outline-warning btn-lg">
        ⭐ Только избранные
    </button>

</div>

<div id="featured" class="mb-5"></div>

<div id="quotes" class="row g-4"></div>

</div>

</section>

<!-- Модальное окно -->

<div class="modal fade" id="quoteModal" tabindex="-1">

<div class="modal-dialog modal-lg modal-dialog-centered">

<div class="modal-content bg-dark text-light">

<div class="modal-header">

<h3 id="modalTitle"></h3>

<button
class="btn-close btn-close-white"
data-bs-dismiss="modal">
</button>

</div>

<div class="modal-body">

    <p id="modalText"
       style="white-space:pre-line;line-height:1.8;"></p>

    <div class="quote-rating">

        <div class="rating-title">
            Ваша оценка:
        </div>

        <div id="ratingStars" class="rating-stars">
            <button data-rating="1">☆</button>
            <button data-rating="2">☆</button>
            <button data-rating="3">☆</button>
            <button data-rating="4">☆</button>
            <button data-rating="5">☆</button>
        </div>

        <div id="ratingText" class="rating-text"></div>

    </div>

</div>

<div class="modal-footer">

    <div id="wisdomDate" class="wisdom-date"></div>

    <button id="prevQuote" class="btn btn-outline-light">
        ← Предыдущая
    </button>

    <button id="nextQuote" class="btn btn-outline-light">
        Следующая →
    </button>

    <button
        id="copyQuote"
        class="btn btn-outline-light">
        📋 Копировать
    </button>

    <button
        id="shareQuote"
        class="btn btn-outline-light">
        🔗 Поделиться
    </button>
    
    <button
        class="btn btn-primary"
        data-bs-dismiss="modal">
        Закрыть
    </button>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js?v=7"></script>

</body>
</html>
