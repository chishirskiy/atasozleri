<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Книга мудрости моего папы</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container py-5">

    <!-- Верхняя часть -->

    <div class="hero-box text-center mb-5">

        <div class="butterfly">
            🦋
        </div>

        <h1 class="hero-title">
            Книга мудрости моего папы
        </h1>

        <p class="hero-subtitle">
            Этот сайт создан с любовью.
            <br>
            Здесь собраны слова, которые помогали мне становиться сильнее.
        </p>

        <button id="openBook" class="btn btn-primary btn-lg mt-4">
            📖 Открыть книгу
        </button>
        
        <div id="book" style="display:none;">
            
    </div>

    <!-- Поиск -->

    <input
        id="search"
        class="form-control form-control-lg mb-4"
        placeholder="🔍 Найти мудрость..."
    >

    <!-- Главная мудрость -->

    <div id="featured" class="mb-5"></div>

    <!-- Остальные -->

<div id="quotes" class="row g-4"></div>

</div>   <!-- конец книги -->

</div>   <!-- container -->
    
<!-- Модальное окно -->

<div class="modal fade" id="quoteModal" tabindex="-1">

    <div class="modal-dialog modal-lg modal-dialog-centered">

        <div class="modal-content bg-dark text-light border-secondary">

            <div class="modal-header border-secondary">

                <h3 class="modal-title" id="modalTitle"></h3>

                <button
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <p id="modalText" style="white-space:pre-line;font-size:18px;line-height:1.8;"></p>

            </div>

            <div class="modal-footer border-secondary">

                <button
                    class="btn btn-primary"
                    data-bs-dismiss="modal">

                    Закрыть

                </button>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    
<script src="script.js"></script>

</body>
</html>
