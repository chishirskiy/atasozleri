<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Книга мудрости моего папы</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="background"></div>

<header class="hero">

    <div class="hero-content">

        <div class="logo">🦋</div>

        <h1>Книга мудрости моего папы</h1>

        <p class="hero-text">
            «Самое ценное наследство —
            это мудрые слова, которые остаются с нами навсегда.»
        </p>

        <a href="#library" class="button">
            📖 Открыть книгу
        </a>

    </div>

</header>

<section id="library">

    <div class="top-panel">

        <input
            type="text"
            id="search"
            placeholder="🔍 Найти мудрость..."
        >

        <div class="stats">

            <div class="stat">
                <span id="totalCount">0</span>
                <small>Всего</small>
            </div>

            <div class="stat">
                <span id="favoriteCount">0</span>
                <small>Избранных</small>
            </div>

        </div>

        <button id="randomBtn">
            🎲 Случайная мудрость
        </button>

    </div>

    <div id="featured"></div>

    <div id="quotes"></div>

</section>

<footer>

    <p>

        ❤️

        Спасибо тебе, папа.

        Этот сайт будет пополняться,
        пока я помню твои слова.

    </p>

</footer>

<script src="script.js"></script>

</body>
</html>
