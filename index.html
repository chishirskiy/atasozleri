<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Книга мудрости моего папы</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container py-5">

    <!-- Верхняя часть -->

    <div class="hero-box text-center mb-5">

        <div class="butterfly">
            🦋
        </div>

        <h1 class="hero-title">
            Книга мудрости моего папы
        </h1>

        <p class="hero-subtitle">
            Этот сайт создан с любовью.
            <br>
            Здесь собраны слова, которые помогали мне становиться сильнее.
        </p>

        <a href="#featured" class="btn btn-primary btn-lg mt-4">
            📖 Открыть книгу
        </a>

    </div>

    <!-- Поиск -->

    <input
        id="search"
        class="form-control form-control-lg mb-4"
        placeholder="🔍 Найти мудрость..."
    >

    <!-- Главная мудрость -->

    <div id="featured" class="mb-5"></div>

    <!-- Остальные -->

    <div id="quotes" class="row g-4"></div>

</div>

<script src="script.js"></script>

</body>
</html>
